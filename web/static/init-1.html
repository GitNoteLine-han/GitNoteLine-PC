<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitNoteLine — 开始使用</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="layout-center">

  <div class="container">
    <header class="header fade-in">
      <h1 class="header-title">开始使用 GitNoteLine</h1>
      <p class="header-subtitle">设置你的 Git 身份信息</p>
    </header>

    <div class="card fade-in">
      <!-- Git config confirm (shown when git config detected) -->
      <div id="git-confirm" class="hidden">
        <p class="card-title">检测到 Git 全局配置</p>
        <div class="git-info">
          <div class="git-info-row">
            <span class="git-info-label">用户名</span>
            <span class="git-info-value" id="git-name"></span>
          </div>
          <div class="git-info-row">
            <span class="git-info-label">邮箱</span>
            <span class="git-info-value" id="git-email"></span>
          </div>
        </div>
        <p class="git-confirm-question">是否使用以上信息？</p>
        <div class="actions">
          <button id="btn-use-git" class="btn btn-primary" style="flex:1">使用</button>
          <button id="btn-manual" class="btn btn-secondary" style="flex:1">手动填写</button>
        </div>
      </div>

      <!-- Manual form (shown when no git config or user clicks "手动填写") -->
      <form id="form-step1" class="form" novalidate>
        <div class="field">
          <label class="field-label" for="field-name">用户名</label>
          <input
            type="text"
            id="field-name"
            class="field-input"
            placeholder="请输入用户名"
            required
            autocomplete="username"
            autofocus
          >
          <p class="field-hint">Git 提交记录的作者名称</p>
        </div>

        <div class="field">
          <label class="field-label" for="field-email">邮箱</label>
          <input
            type="email"
            id="field-email"
            class="field-input"
            placeholder="请输入邮箱地址"
            required
            autocomplete="email"
          >
          <p class="field-hint">用于 Git 提交签名</p>
        </div>

        <p id="form-error" class="form-error hidden"></p>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block btn-lg">
          <span id="btn-text">继续</span>
          <svg id="btn-spinner" class="spinner-svg spin hidden" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api-adapter.js"></script>
  <script src="/js/init.js"></script>
</body>
</html>

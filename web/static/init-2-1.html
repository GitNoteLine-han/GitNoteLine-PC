<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitNoteLine — 创建在线仓库</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="layout-center">

  <div class="container">
    <header class="header fade-in">
      <h1 class="header-title">创建在线仓库</h1>
      <p class="header-subtitle">配置远程仓库和本地路径</p>
    </header>

    <div class="card fade-in">
      <form id="form-step2-1" class="form" novalidate>
        <!-- Remote URL -->
        <div class="field">
          <label class="field-label" for="field-remote-url">远程仓库 URL</label>
          <input
            type="text"
            id="field-remote-url"
            class="field-input"
            placeholder="https://github.com/username/repo.git"
            required
          >
          <p class="field-hint">粘贴你的 Git 仓库地址</p>
        </div>

        <!-- Detected host -->
        <div id="host-display" class="host-display hidden">
          <span class="host-label">平台：</span>
          <span id="host-value" class="host-value"></span>
        </div>

        <!-- Local path -->
        <div class="field">
          <label class="field-label" for="field-local-path">本地路径</label>
          <input
            type="text"
            id="field-local-path"
            class="field-input"
            placeholder="~/gitnoteline/notes"
            required
          >
          <p class="field-hint">笔记仓库在本机的存储位置</p>
        </div>

        <!-- Credential name -->
        <div class="field">
          <label class="field-label" for="field-credential-name">凭证名称</label>
          <input
            type="text"
            id="field-credential-name"
            class="field-input"
            placeholder="GitHub 个人账号"
            required
          >
          <p class="field-hint">给这个凭证起个名字，方便识别</p>
        </div>

        <!-- Credential type -->
        <div class="field">
          <label class="field-label">凭证类型</label>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" name="credential-type" value="fine_grained" checked>
              <span>精细化密钥</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="credential-type" value="password">
              <span>通用密钥/密码</span>
            </label>
          </div>
        </div>

        <!-- GitHub password warning -->
        <div id="github-warning" class="warning-banner hidden">
          GitHub 不支持密码认证，请使用 Personal Access Token
        </div>

        <!-- Credential secret -->
        <div class="field">
          <label class="field-label" for="field-credential-secret">凭证</label>
          <input
            type="password"
            id="field-credential-secret"
            class="field-input"
            placeholder="输入你的 Token 或密码"
            required
          >
          <p class="field-hint">将安全存储在系统钥匙串中</p>
        </div>

        <p id="form-error" class="form-error hidden"></p>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block btn-lg">
          <span id="btn-text">创建仓库</span>
          <svg id="btn-spinner" class="spinner-svg spin hidden" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api-adapter.js"></script>
  <script src="/js/init-2-1.js"></script>
</body>
</html>

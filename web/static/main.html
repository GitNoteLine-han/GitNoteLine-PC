<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitNoteLine</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="main-layout">
  <!-- Top navigation bar -->
  <header class="main-header">
    <div class="brand">GitNoteLine</div>
    <div class="header-actions">
      <button class="btn-icon" title="设置">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="20" height="20">
          <path d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main content area -->
  <div class="main-content">
    <!-- Left sidebar -->
    <aside class="sidebar">
      <!-- Notes list -->
      <div class="notes-list" id="notes-list">
        <!-- Notes will be dynamically inserted here -->
      </div>

      <!-- Bottom bar: repo selector + plus button -->
      <div class="bottom-bar">
        <div class="repo-selector">
          <select id="repo-select" class="repo-select">
            <option value="">加载中...</option>
          </select>
          <span class="dropdown-arrow">▼</span>
        </div>
        <button class="btn-new-note" id="btn-new-note" title="新建笔记">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="16" height="16">
            <path d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Right content area - Note preview -->
    <main class="note-viewer">
      <div class="note-viewer-placeholder" id="note-placeholder">
        <p>选择一个笔记开始查看</p>
      </div>
      <div class="note-preview" id="note-preview" style="display: none;">
        <div class="note-preview-header">
          <span class="note-preview-title" id="note-preview-title"></span>
          <button class="btn-edit-note" id="btn-edit-note" title="编辑笔记">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="16" height="16">
              <path d="M535.6 85.7C513.7 63.8 478.3 63.8 456.4 85.7L432 110.1L529.9 208L554.3 183.6C576.2 161.7 576.2 126.3 554.3 104.4L535.6 85.7zM236.4 305.7C230.3 311.8 225.6 319.3 222.9 327.6L193.3 416.4C190.4 425 192.7 434.5 199.1 441C205.5 447.5 215 449.7 223.7 446.8L312.5 417.2C320.7 414.5 328.2 409.8 334.4 403.7L496 241.9L398.1 144L236.4 305.7zM160 128C107 128 64 171 64 224L64 480C64 533 107 576 160 576L416 576C469 576 512 533 512 480L512 384C512 366.3 497.7 352 480 352C462.3 352 448 366.3 448 384L448 480C448 497.7 433.7 512 416 512L160 512C142.3 512 128 497.7 128 480L128 224C128 206.3 142.3 192 160 192L256 192C273.7 192 288 177.7 288 160C288 142.3 273.7 128 256 128L160 128z"/>
            </svg>
          </button>
        </div>
        <div class="note-preview-content" id="note-preview-content"></div>
      </div>
    </main>
  </div>

  <!-- New note dialog -->
  <dialog id="new-note-dialog" class="dialog">
    <form id="new-note-form" class="dialog-form">
      <h3>新建笔记</h3>
      <div class="form-field">
        <label for="note-name-input">笔记名称</label>
        <div class="input-with-suffix">
          <input type="text" id="note-name-input" placeholder="例如：日记/2026-01-01" required>
          <span class="input-suffix">.md</span>
        </div>
        <p class="field-hint">支持子目录，例如：工作/项目笔记</p>
      </div>
      <div class="dialog-error" id="dialog-error"></div>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" id="btn-cancel-note">取消</button>
        <button type="submit" class="btn-primary">创建</button>
      </div>
    </form>
  </dialog>

  <script src="/lib/marked.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>

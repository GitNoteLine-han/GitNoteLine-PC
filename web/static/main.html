<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitNoteLine</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="main-layout">
  <!-- Top navigation bar -->
  <header class="main-header">
    <div class="brand">GitNoteLine</div>
    <div class="header-actions">
      <button class="btn-icon btn-sync" id="btn-sync" title="同步中...">
        <img src="/icons/arrows-rotate-solid-full.svg" alt="同步" width="20" height="20">
      </button>
      <a href="/setting" class="btn-icon" title="设置">
        <img src="/icons/gear-solid-full.svg" alt="设置" width="20" height="20">
      </a>
    </div>
  </header>

  <!-- Main content area -->
  <div class="main-content">
    <!-- Left sidebar -->
    <aside class="sidebar">
      <!-- Notes list -->
      <div class="notes-list" id="notes-list">
        <!-- Notes will be dynamically inserted here -->
      </div>

      <!-- Bottom bar: repo selector + plus button -->
      <div class="bottom-bar">
        <div class="repo-selector">
          <select id="repo-select" class="repo-select">
            <option value="">加载中...</option>
          </select>
          <span class="dropdown-arrow">▼</span>
        </div>
        <button class="btn-new-note" id="btn-new-note" title="新建笔记">
          <img src="/icons/plus-solid.svg" alt="新建" width="16" height="16">
        </button>
      </div>
    </aside>

    <!-- Right content area - Note preview -->
    <main class="note-viewer">
      <div class="note-viewer-placeholder" id="note-placeholder">
        <p>选择一个笔记开始查看</p>
      </div>
      <div class="note-preview" id="note-preview" style="display: none;">
        <div class="note-preview-header">
          <span class="note-preview-title" id="note-preview-title"></span>
          <button class="btn-edit-note" id="btn-edit-note" title="编辑笔记">
            <img src="/icons/pen-to-square-solid-full.svg" alt="编辑" width="16" height="16">
          </button>
        </div>
        <div class="note-preview-content" id="note-preview-content"></div>
      </div>
    </main>
  </div>

  <!-- Delete confirmation dialog -->
  <dialog id="delete-dialog" class="warning-modal">
    <div class="warning-content">
      <h3 class="warning-title" id="delete-dialog-title">确认删除</h3>
      <p class="warning-text" id="delete-dialog-text"></p>
      <div class="warning-actions">
        <button type="button" class="btn-warning-secondary" id="btn-delete-cancel">取消</button>
        <button type="button" class="btn-warning-primary" id="btn-delete-confirm">删除</button>
      </div>
    </div>
  </dialog>

  <!-- New note dialog -->
  <dialog id="new-note-dialog" class="dialog">
    <form id="new-note-form" class="dialog-form">
      <h3>新建笔记</h3>
      <div class="form-field">
        <label for="note-name-input">笔记名称</label>
        <div class="input-with-suffix">
          <input type="text" id="note-name-input" placeholder="例如：日记/2026-01-01" required>
          <span class="input-suffix">.md</span>
        </div>
        <p class="field-hint">支持子目录，例如：工作/项目笔记</p>
      </div>
      <div class="dialog-error" id="dialog-error"></div>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" id="btn-cancel-note">取消</button>
        <button type="submit" class="btn-primary">创建</button>
      </div>
    </form>
  </dialog>

  <script src="/lib/marked.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>

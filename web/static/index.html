<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitNoteLine</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="layout-center">

  <div class="container">
    <header class="header fade-in">
      <h1 class="header-title">GitNoteLine</h1>
      <p class="header-subtitle">Git 驱动的笔记管理</p>
    </header>

    <section class="card fade-in">
      <h2 class="card-title">连接状态</h2>
      <p class="status-text" id="status-message">正在连接…</p>
    </section>

    <section class="card fade-in">
      <h2 class="card-title">快速测试</h2>
      <div class="actions">
        <button id="btn-hello" class="btn btn-primary">呼叫 API</button>
      </div>
      <pre id="api-output" class="output-box"></pre>
    </section>
  </div>

  <script src="/js/api-adapter.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>

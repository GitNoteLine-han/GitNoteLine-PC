<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitNoteLine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>📝 GitNoteLine</h1>
      <p class="subtitle">Git-backed note taking</p>
    </header>

    <main>
      <section class="card" id="status-card">
        <h2>连接状态</h2>
        <p id="status-message">正在连接…</p>
      </section>

      <section class="card">
        <h2>快速测试</h2>
        <button id="btn-hello" class="btn">呼叫 API</button>
        <pre id="api-output" class="output-box"></pre>
      </section>
    </main>
  </div>

  <!-- api-adapter must load first — it's the bridge for pywebview -->
  <script src="js/api-adapter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

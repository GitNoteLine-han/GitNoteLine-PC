<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 - GitNoteLine</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="setting-layout">
  <header class="setting-header">
    <a href="/setting" class="btn-back">← 返回设置</a>
    <h1>关于</h1>
  </header>

  <main class="setting-content">
    <!-- Build Notice -->
    <section class="setting-section">
      <div class="build-notice" id="build-notice">加载中...</div>
    </section>

    <!-- Links -->
    <section class="setting-section">
      <h2 class="setting-section-title">更多信息</h2>

      <a href="/docs/" class="setting-item setting-item-link">
        <div class="setting-item-info">
          <span class="setting-item-label">文档</span>
          <span class="setting-item-desc">使用指南与开发文档</span>
        </div>
        <span class="setting-item-arrow">→</span>
      </a>

      <a href="/about/notice" class="setting-item setting-item-link">
        <div class="setting-item-info">
          <span class="setting-item-label">NOTICE</span>
          <span class="setting-item-desc">第三方资源与依赖声明</span>
        </div>
        <span class="setting-item-arrow">→</span>
      </a>

      <a href="/about/license" class="setting-item setting-item-link">
        <div class="setting-item-info">
          <span class="setting-item-label">LICENSE</span>
          <span class="setting-item-desc">GNU Affero General Public License v3.0</span>
        </div>
        <span class="setting-item-arrow">→</span>
      </a>
    </section>
  </main>

  <script src="/js/about.js"></script>
</body>
</html>

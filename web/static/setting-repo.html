<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>笔记仓库管理 - GitNoteLine</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

    <a href="/setting" class="btn-back">← 返回设置</a>

          笔记仓库管理功能正在开发中，敬请期待。
        </p>
        <div class="warning-actions" style="justify-content:center;">
          <a href="/setting" class="btn-warning-secondary" style="text-decoration:none;text-align:center;display:inline-block;">返回设置</a>
        </div>
      </div>
    </dialog>
  </main>

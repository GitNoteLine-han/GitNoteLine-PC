<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑笔记 - GitNoteLine</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Editor selection dialog */
    .editor-selection-dialog {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .editor-selection-content {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 32px;
      max-width: 600px;
      width: 90%;
      box-shadow: var(--shadow-lg);
    }

    .editor-selection-content h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .editor-selection-content p {
      margin: 0 0 24px 0;
      color: var(--gray-600);
      font-size: 0.95rem;
    }

    .editor-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .editor-option {
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .editor-option:hover {
      border-color: var(--blue-500);
      background: var(--gray-50);
    }

    .editor-option.recommended {
      border-color: var(--blue-500);
      background: var(--blue-50);
    }

    .editor-option-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .editor-option-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gray-900);
    }

    .editor-option-badge {
      background: var(--blue-500);
      color: var(--white);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    .editor-option-desc {
      color: var(--gray-600);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* Editor container */
    .editor-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--white);
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--gray-200);
      background: var(--gray-50);
    }

    .editor-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray-900);
    }

    .editor-actions {
      display: flex;
      gap: 8px;
    }

    .editor-mode-toggle {
      display: flex;
      gap: 4px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 4px;
    }

    .mode-btn {
      padding: 6px 12px;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--gray-600);
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--blue-500);
      color: var(--white);
    }

    .mode-btn:hover:not(.active) {
      background: var(--gray-100);
    }

    .editor-main {
      flex: 1;
      overflow: hidden;
      position: relative;
      display: flex;
    }

    .editor-pane {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .editor-pane.split {
      flex: 0 0 50%;
      border-right: 1px solid var(--gray-200);
    }

    #monaco-container {
      width: 100%;
      height: 100%;
    }

    .preview-pane {
      flex: 0 0 50%;
      overflow-y: auto;
      padding: 32px;
      background: var(--gray-50);
    }

    .preview-content {
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .preview-content h1 { font-size: 2rem; margin: 1rem 0; }
    .preview-content h2 { font-size: 1.5rem; margin: 0.8rem 0; }
    .preview-content h3 { font-size: 1.25rem; margin: 0.6rem 0; }
    .preview-content p { margin: 0.5rem 0; }
    .preview-content code {
      background: var(--gray-200);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
    .preview-content pre {
      background: var(--gray-900);
      color: var(--gray-100);
      padding: 16px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
    }
    .preview-content ul, .preview-content ol {
      margin: 0.5rem 0;
      padding-left: 2rem;
    }

    /* Image panel styles */
    .image-panel {
      width: 240px;
      background: var(--gray-50);
      border-right: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .image-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--gray-200);
      background: var(--white);
    }

    .image-panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--gray-900);
    }

    .btn-upload {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background 0.15s ease;
    }

    .btn-upload:hover {
      background: var(--gray-100);
    }

    .image-section {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .image-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .image-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .image-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      cursor: grab;
      transition: all 0.15s ease;
    }

    .image-item:hover {
      border-color: var(--blue-500);
      box-shadow: var(--shadow-sm);
    }

    .image-item:active {
      cursor: grabbing;
    }

    .image-item.staged {
      border-color: var(--orange-500);
      background: var(--orange-50);
    }

    .image-thumbnail {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      background: var(--gray-100);
    }

    .image-info {
      flex: 1;
      min-width: 0;
    }

    .image-name {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--gray-800);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .image-path {
      font-size: 0.7rem;
      color: var(--gray-500);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .image-path-input {
      width: 100%;
      font-size: 0.7rem;
      padding: 2px 4px;
      border: 1px solid var(--gray-300);
      border-radius: 3px;
      font-family: monospace;
    }

    .image-empty {
      padding: 16px;
      text-align: center;
      color: var(--gray-500);
      font-size: 0.8rem;
    }

    #tiptap-container {
      width: 100%;
      height: calc(100% - 50px);
      overflow-y: auto;
      padding: 32px;
    }

    .tiptap-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
    }

    .toolbar-btn {
      padding: 6px 12px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--gray-700);
      transition: all 0.15s ease;
    }

    .toolbar-btn:hover {
      background: var(--gray-100);
      border-color: var(--gray-300);
    }

    .toolbar-btn:active {
      background: var(--gray-200);
    }

    .toolbar-separator {
      width: 1px;
      height: 20px;
      background: var(--gray-200);
      margin: 0 4px;
    }

    .tiptap-editor {
      max-width: 800px;
      margin: 0 auto;
      min-height: 100%;
      outline: none;
    }

    .tiptap-editor h1 { font-size: 2rem; margin: 1rem 0; }
    .tiptap-editor h2 { font-size: 1.5rem; margin: 0.8rem 0; }
    .tiptap-editor h3 { font-size: 1.25rem; margin: 0.6rem 0; }
    .tiptap-editor p { margin: 0.5rem 0; line-height: 1.6; }
    .tiptap-editor code {
      background: var(--gray-100);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }
    .tiptap-editor pre {
      background: var(--gray-900);
      color: var(--gray-100);
      padding: 16px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
    }
    .tiptap-editor ul, .tiptap-editor ol {
      margin: 0.5rem 0;
      padding-left: 2rem;
    }

    .hidden {
      display: none !important;
    }

    .btn-save {
      padding: 8px 16px;
      background: var(--blue-500);
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .btn-save:hover {
      background: var(--blue-600);
    }

    .btn-back {
      padding: 8px 16px;
      background: var(--white);
      color: var(--gray-700);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-back:hover {
      background: var(--gray-50);
    }
  </style>
</head>
<body>
  <!-- Editor selection dialog (shown on first time) -->
  <div id="editor-selection-dialog" class="editor-selection-dialog hidden">
    <div class="editor-selection-content">
      <h2>选择编辑器模式</h2>
      <p>选择你偏好的笔记编辑方式，稍后可以在编辑器中切换</p>
      
      <div class="editor-options">
        <div class="editor-option recommended" data-mode="tiptap">
          <div class="editor-option-header">
            <span class="editor-option-title">可视化编辑</span>
            <span class="editor-option-badge">推荐</span>
          </div>
          <div class="editor-option-desc">
            所见即所得的编辑体验，适合日常笔记记录。支持格式化、列表、代码块等，无需学习 Markdown 语法。
          </div>
        </div>
        
        <div class="editor-option" data-mode="monaco">
          <div class="editor-option-header">
            <span class="editor-option-title">Markdown 源码</span>
          </div>
          <div class="editor-option-desc">
            专业的代码编辑器，适合资深 Markdown 用户。直接编辑 Markdown 源码，支持语法高亮和智能提示。
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Editor container -->
  <div class="editor-container">
    <div class="editor-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="btn-back" onclick="window.history.back()">← 返回</button>
        <span class="editor-title" id="note-title">加载中...</span>
      </div>
      
      <div class="editor-actions">
        <div class="editor-mode-toggle">
          <button class="mode-btn" data-mode="tiptap">可视化</button>
          <button class="mode-btn" data-mode="monaco">源码</button>
        </div>
        <button class="btn-save" id="btn-save">保存</button>
      </div>
    </div>
    
    <div class="editor-main">
      <!-- Monaco mode with split view and image panel -->
      <div id="monaco-mode" class="hidden" style="display: flex; width: 100%; height: 100%;">
        <!-- Image panel (left) -->
        <div class="image-panel" id="image-panel">
          <div class="image-panel-header">
            <h3>图片管理</h3>
            <button class="btn-upload" id="btn-upload-image" title="上传图片">📁</button>
          </div>
          <div class="image-section">
            <div class="image-section-title">已有图片</div>
            <div class="image-list" id="existing-images">
              <!-- Existing images will be loaded here -->
            </div>
          </div>
          <div class="image-section">
            <div class="image-section-title">暂存图片</div>
            <div class="image-list" id="staged-images">
              <!-- Staged images will appear here -->
            </div>
          </div>
        </div>
        
        <!-- Editor and preview (right) -->
        <div style="flex: 1; display: flex; flex-direction: column;">
          <div style="flex: 1; display: flex;">
            <div class="editor-pane split">
              <div id="monaco-container"></div>
            </div>
            <div class="preview-pane">
              <div class="preview-content" id="preview-content"></div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- TipTap mode (now using Quill) -->
      <div id="tiptap-mode" class="hidden" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
        <div id="quill-editor" style="flex: 1; overflow-y: auto;"></div>
      </div>
    </div>
  </div>

  <!-- Load Quill.js for WYSIWYG editing -->
  <link href="/lib/quill.snow.css" rel="stylesheet">
  <script src="/lib/quill.js"></script>

  <!-- Load marked.js and turndown BEFORE Monaco (Monaco's loader creates AMD environment) -->
  <script src="/lib/marked.min.js"></script>
  <script src="/lib/turndown.js"></script>

  <!-- Load Monaco Editor from local (creates AMD environment) -->
  <script src="/lib/monaco-editor/min/vs/loader.js"></script>

  <script src="/js/editor.js"></script>
</body>
</html>
